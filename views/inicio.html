<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Balsas - Inicio</title>
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="cabecera-app">
    <h1>Balsas Picarral</h1>
    <button class="enlace" id="botonCerrarSesion">Cerrar sesión</button>
    <button class="enlace" id="botonPantallaCompleta" style="display: inline-flex; align-items: center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;">
        <polyline points="15 3 21 3 21 9"></polyline>
        <polyline points="9 21 3 21 3 15"></polyline>
        <line x1="21" y1="3" x2="14" y2="10"></line>
        <line x1="3" y1="21" x2="10" y2="14"></line>
      </svg>
    </button>  
  </header>

  <div class="contenedor" style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.2rem;">
    <div id="avisoPartidoEnCurso" class="aviso oculto">
      Tienes un partido en curso.
      <div style="margin-top: 0.5rem;">
        <a id="enlaceReanudar" class="boton primario ancho" style="display:block; text-align:center;">Reanudar partido</a>
      </div>
    </div>

    <div class="tarjeta tarjeta-nav" onclick="location.href='partidos.html'">
      <div class="tarjeta-nav-info">
        <img class="icono-titulo" src="../assets/partido.svg" alt="">
        <h2 class="titulo-inicio">Partidos</h2>
      </div>
      <img src="../assets/delante.svg" class="icono-cabecera" alt="icono entrar">
    </div>

    <div class="tarjeta tarjeta-nav" onclick="location.href='plantilla.html'">
      <div class="tarjeta-nav-info">
        <img class="icono-titulo" src="../assets/plantilla.svg" alt="">
        <h2 class="titulo-inicio">Plantilla</h2>
      </div>
      <img src="../assets/delante.svg" class="icono-cabecera" alt="icono entrar">
    </div>

    <div class="tarjeta tarjeta-nav" onclick="location.href='estadisticas.html'">
      <div class="tarjeta-nav-info">
        <img class="icono-titulo" src="../assets/estadisticas.svg" alt="">
        <h2 class="titulo-inicio">Estadisticas</h2>
      </div>
      <img src="../assets/delante.svg" class="icono-cabecera" alt="icono entrar">
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/comun.js"></script>
  <script src="../js/inicio.js"></script>
</body>
</html>
