<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Balsas - Plantilla</title>
<link rel="stylesheet" href="../css/styles.css" />
<link rel="stylesheet" href="../css/plantilla.css" />
</head>
<body>
  <header class="cabecera-app">
    <a href="inicio.html">
      <img src="../assets/volver.svg" class="icono-cabecera" alt="icono para volver">
    </a>
    <h1>Plantilla</h1>
    <button class="enlace" id="botonPantallaCompleta" style="display: inline-flex; align-items: center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;">
        <polyline points="15 3 21 3 21 9"></polyline>
        <polyline points="9 21 3 21 3 15"></polyline>
        <line x1="21" y1="3" x2="14" y2="10"></line>
        <line x1="3" y1="21" x2="10" y2="14"></line>
      </svg>
    </button>
  </header>

  <div class="contenedor">
    <button class="primario ancho" id="botonNuevoJugador">+ Añadir jugador</button>

    <div id="formularioJugador" class="tarjeta oculto" style="margin-top:0.75rem;">
      <input type="hidden" id="jugadorId" />
      <label for="nombreJugador">Nombre</label>
      <input type="text" id="nombreJugador" />
      <label for="dorsalJugador">Dorsal</label>
      <input type="number" id="dorsalJugador" min="1" />
      
      <label>Posición principal</label>
      <div class="selector-posiciones" id="selectorPrincipal"></div>
      
      <label>Posiciones secundarias (opcional)</label>
      <div class="selector-posiciones" id="selectorSecundario"></div>
      
      <div class="fila-botones">
        <button class="primario ancho" id="botonGuardarJugador">Guardar</button>
        <button class="ancho" id="botonCancelarJugador">Cancelar</button>
      </div>
    </div>

    <div class="tarjeta" style="overflow-x:auto; padding:10px; margin-top: 20px;">
      <table id="tablaJugadores">
        <!-- Añadir columna "Ficha" en el <thead> -->
        <thead>
          <tr>
            <th>Jugador</th>
            <th>Posiciones</th>
            <th style="text-align:right;">Acciones</th>
            <th style="text-align:center;">Ficha</th>  <!-- NUEVO -->
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div id="modalConfirmarBorrado" class="superposicion oculto">
    <div class="hoja-modal">
      <p style="font-weight:600;">¿Seguro que quieres borrar este jugador?</p>
      <div class="fila-botones">
        <button class="ancho peligro" id="botonConfirmarBorrado">Borrar</button>
        <button class="ancho" id="botonCancelarBorrado">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/comun.js"></script>
  <script src="../js/formaciones.js"></script>
  <script src="../js/plantilla.js"></script>
</body>
</html>
