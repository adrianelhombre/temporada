<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Balsas - Estadísticas</title>
<link rel="stylesheet" href="../css/styles.css" />
<link rel="stylesheet" href="../css/estadisticas.css" />
</head>
<body>
  <header class="cabecera-app">
    <a href="inicio.html">
      <img src="../assets/volver.svg" class="icono-cabecera" alt="icono para volver">
    </a>
    <h1>Estadísticas</h1>
    <button class="enlace" id="botonPantallaCompleta" style="display: inline-flex; align-items: center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;">
        <polyline points="15 3 21 3 21 9"></polyline>
        <polyline points="9 21 3 21 3 15"></polyline>
        <line x1="21" y1="3" x2="14" y2="10"></line>
        <line x1="3" y1="21" x2="10" y2="14"></line>
      </svg>
    </button>
  </header>

  <div class="contenedor">    
    <!-- Botones de selección -->
    <div class="fila-botones" style="display: flex; gap: 0.5rem; margin-bottom: 1.2rem;">
      <button class="ancho btn-equipo activo" id="btnJugadores" type="button" style="flex: 1; font-size:1.2rem">Jugadores</button>
      <button class="ancho btn-equipo" id="btnEquipo" type="button" style="flex: 1; font-size:1.2rem">Equipo</button>
    </div>

    <!-- FILTROS DE TIPO DE PARTIDO -->
    <div class="fila-botones" style="display: flex; gap: 0.5rem; margin: 0 0 1.2rem 0; flex-wrap: wrap;">
      <button class="ancho btn-equipo activo" data-tipo="todos" style="flex:1; min-width:60px; font-size:1rem;">Todos</button>
      <button class="ancho btn-equipo" data-tipo="Liga" style="flex:1; min-width:60px; font-size:1rem;">Liga</button>
      <button class="ancho btn-equipo" data-tipo="Amistoso" style="flex:1; min-width:60px; font-size:1rem;">Amistosos</button>
      <button class="ancho btn-equipo" data-tipo="Copa" style="flex:1; min-width:60px; font-size:1rem;">Copa</button>
      <button class="ancho btn-equipo" data-tipo="Torneo" style="flex:1; min-width:60px; font-size:1rem;">Torneos</button>
    </div>

    <!-- Contenedor para estadísticas de equipo -->
    <div id="vistaEquipo" style="display:none;">
      <div class="tarjeta estadisticas-equipo-tarjeta">
        <div id="estadisticasEquipo"></div>
      </div>
    </div>

    <!-- Contenedor para estadísticas de jugadores -->
    <div id="vistaJugadores">
      <div class="tarjeta" style="overflow-x:auto; padding:10px;">
        <div id="estadisticasJugadores"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/comun.js"></script>
  <script src="../js/estadisticas/equipo.js"></script>
  <script src="../js/estadisticas/jugadores.js"></script>
  <script src="../js/estadisticas/main.js"></script>
</body>
</html>
