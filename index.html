<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Balsas - Acceso</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="contenedor" style="max-width: 360px; padding-top: 4rem;">
    <h2 style="text-align:center;">Balsas Picarral</h2>
    <div class="tarjeta">
      <form id="formularioLogin">
        <label for="email">Correo</label>
        <input type="email" id="email" required autocomplete="username" />
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password" />
        <p id="errorLogin" style="color:#d64545; font-size:0.85rem; display:none;"></p>
        <button type="submit" class="primario ancho">Entrar</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
